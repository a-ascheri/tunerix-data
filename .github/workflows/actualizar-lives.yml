name: Actualizar Lives YouTube

on:
  schedule:
    # Cada 40 minutos: corre a los :00 y :60 de cada hora (intervalos de 1 hs).
    - cron: '0 * * * *'
  # Permite ejecutarlo a mano desde la pestaña "Actions" para probar
  workflow_dispatch:

# Le da permiso al robot para guardar el archivo lives.json
permissions:
  contents: write

# Una sola corrida por vez: si dos se cruzan, se enfilan en orden y no se pisan
concurrency:
  group: actualizar-lives
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # checkout@v7 y setup-node@v7 corren con Node 24 (lo de Node 20 ya está deprecado)
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ejecutar script de lives
        env:
          # Acá el robot busca la clave que guardaste en los secretos
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node tools/actualizar-lives.js

      - name: Guardar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lives.json
          # Solo sube si el archivo realmente cambió
          if git diff --cached --quiet; then
            echo "Sin cambios: lives.json queda igual."
          else
            git commit -m "chore: actualizar lives de YouTube [skip ci]"
            git fetch origin main
            # Rebase contra lo último de main. Si otra corrida ya publicó algo
            # más nuevo (incluido RE-CORRER una corrida vieja), el conflicto se
            # resuelve a favor de lo YA PUBLICADO: la corrida superada no sube
            # nada y el run cierra verde, no en failure.
            if ! git rebase -X ours --empty=drop origin/main; then
              git rebase --abort
              echo "Corrida superada por una más nueva: no se publica nada."
              exit 0
            fi
            git push
          fi
