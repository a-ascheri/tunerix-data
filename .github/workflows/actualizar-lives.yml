name: Actualizar Lives YouTube

on:
  schedule:
    # Corre cada 20 minutos. (No lo bajes a menos de 15 min por el límite de la API)
    - cron: '*/20 * * * *'
  # Permite ejecutarlo a mano desde la pestaña "Actions" para probar
  workflow_dispatch: 

# Le da permiso al robot para guardar el archivo lives.json
permissions:
  contents: write 

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de lives
        env:
          # Acá el robot busca la clave que guardaste en los secretos
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node tools/actualizar-lives.js

      - name: Guardar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lives.json
          # Solo hace commit si el archivo realmente cambió
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar lives de YouTube [skip ci]"
            git push
          else
            echo "Sin cambios en lives.json"
          fi
